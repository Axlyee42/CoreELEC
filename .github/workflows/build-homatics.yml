name: Build CoreELEC 22 Homatics Box R 4K Plus

on:
  workflow_dispatch:
  push:
    branches: [coreelec-22]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  build:
    name: Build Homatics S905X4-K
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: coreelec-22
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex gawk gcc git make mtools ncurses-dev python3 unzip util-linux wget xz-utils zstd xfonts-utils rdfind libparse-yapp-perl gperf xsltproc libxml-parser-perl patchutils lzop

      - name: Fetch and verify FEL dovi.ko
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/Amlogic-ce/packages/dovi/files
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.request

          topic = json.load(urllib.request.urlopen('https://discourse.coreelec.org/t/58631.json'))
          wanted = '5.15_2.6_dovi_patched_fix_fel.ko'
          found = None

          for post in topic.get('post_stream', {}).get('posts', []):
              cooked = html.unescape(post.get('cooked', ''))
              if wanted not in cooked:
                  continue
              m = re.search(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>[^<]*' + re.escape(wanted), cooked, re.I)
              if m:
                  found = m.group(1)
                  break
              m = re.search(r'href=["\']([^"\']+)["\'][^>]*[^>]*' + re.escape(wanted), cooked, re.I)
              if m:
                  found = m.group(1)
                  break

          if not found:
              raise SystemExit('Could not find the exact dovi.ko attachment in CoreELEC forum topic 58631')

          if found.startswith('/'):
              found = 'https://discourse.coreelec.org' + found
          print(found)
          open('/tmp/dovi-url', 'w').write(found)
          PY

          DOVI_URL="$(cat /tmp/dovi-url)"
          curl -fL --retry 5 --retry-all-errors "$DOVI_URL" -o projects/Amlogic-ce/packages/dovi/files/dovi.ko
          test -s projects/Amlogic-ce/packages/dovi/files/dovi.ko
          ACTUAL_SHA256="$(sha256sum projects/Amlogic-ce/packages/dovi/files/dovi.ko | cut -d' ' -f1)"
          echo "dovi.ko SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "f6c26659a255447685ceac9441e399c999b1fae9c6435c48d70e14a14dd7f8f7"

      - name: Prepare build config
        run: |
          echo "CoreELEC 22 Homatics Box R 4K Plus"
          echo "Project: Amlogic-ce"
          echo "Device: Amlogic-no"
          echo "Architecture: aarch64"
          echo "DTB: sc2_s905x4_sei_smb_280.dtb"

      - name: Build CoreELEC image
        run: |
          set -euo pipefail
          PROJECT=Amlogic-ce DEVICE=Amlogic-no ARCH=aarch64 make image

      - name: Make Homatics DTB and dovi self-contained
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(find target -type f -name 'CoreELEC-Amlogic-no.aarch64-22.0-Piers*Generic.img.gz' -print -quit)"
          test -n "$IMAGE"
          RAW="${RUNNER_TEMP}/coreelec.img"
          gunzip -c "$IMAGE" > "$RAW"

          OFFSET="$(IMG="$RAW" python3 -c 'import json,os,subprocess; d=json.loads(subprocess.check_output(["sfdisk","-J",os.environ["IMG"]])); print(min(p["start"] for p in d["partitiontable"]["partitions"])*d["partitiontable"].get("sectorsize",512))')"
          export MTOOLS_SKIP_CHECK=1

          mcopy -i "${RAW}@@${OFFSET}" '::device_trees/sc2_s905x4_sei_smb_280.dtb' "${RUNNER_TEMP}/dtb.img"
          test "$(od -A n -t x1 -N 4 "${RUNNER_TEMP}/dtb.img" | tr -d ' \n')" = "d00dfeed"
          mcopy -i "${RAW}@@${OFFSET}" "${RUNNER_TEMP}/dtb.img" '::dtb.img'

          cp projects/Amlogic-ce/packages/dovi/files/dovi.ko "${RUNNER_TEMP}/dovi.ko"
          test "$(sha256sum "${RUNNER_TEMP}/dovi.ko" | cut -d' ' -f1)" = "f6c26659a255447685ceac9441e399c999b1fae9c6435c48d70e14a14dd7f8f7"
          mcopy -i "${RAW}@@${OFFSET}" "${RUNNER_TEMP}/dovi.ko" '::dovi.ko'

          gzip -n -6 -c "$RAW" > "${IMAGE}.homatics.tmp"
          mv -f "${IMAGE}.homatics.tmp" "$IMAGE"

      - name: Prepare release name
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(find target -type f -name 'CoreELEC-Amlogic-no.aarch64-22.0-Piers*Generic.img.gz' -print -quit)"
          test -n "$IMAGE"
          mkdir -p release
          cp "$IMAGE" "release/CoreELEC-Homatics-4K-Plus-${BUILD_DATE}.img.gz"
          sha256sum "release/CoreELEC-Homatics-4K-Plus-${BUILD_DATE}.img.gz" > release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Homatics-4K-Plus-${{ env.BUILD_DATE }}
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: homatics-${{ env.BUILD_DATE }}
          name: CoreELEC Homatics 4K Plus ${{ env.BUILD_DATE }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: release/*
