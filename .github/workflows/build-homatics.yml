name: Build CoreELEC 22 Homatics Box R 4K Plus

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  build:
    name: Build Homatics S905X4-K
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex gawk gcc git make ncurses-dev python3 unzip wget xz-utils zstd

      - name: Prepare Dolby Vision module
        run: |
          mkdir -p packages/dovi/files
          # Place 5.15_2.6_dovi_patched_fix_fel.ko here
          # Rename to dovi.ko before build
          if [ -f packages/dovi/files/5.15_2.6_dovi_patched_fix_fel.ko ]; then
            mv packages/dovi/files/5.15_2.6_dovi_patched_fix_fel.ko packages/dovi/files/dovi.ko
          fi

      - name: Build CoreELEC image
        run: |
          echo 'Homatics Box R 4K Plus build initialized'
          echo 'Target: S905X4-K'
          echo 'DTB: sc2_s905x4_sei_smb_280.dtb'
          echo 'Dolby Vision FEL module: enabled'
          make image PROJECT=Amlogic-no DEVICE=Homatics ARCH=aarch64

      - name: Inject Dolby Vision module
        run: |
          mkdir -p target/dovi
          if [ -f packages/dovi/files/dovi.ko ]; then
            cp packages/dovi/files/dovi.ko target/dovi/
          fi

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Homatics-S905X4-DV
          path: target/*
