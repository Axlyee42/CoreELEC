name: Build CoreELEC 22 Homatics Box R 4K Plus

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  build:
    name: Build Homatics S905X4-K
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex gawk gcc git make ncurses-dev python3 unzip wget xz-utils zstd

      - name: Prepare build config
        run: |
          echo "CoreELEC 22 Homatics Box R 4K Plus"
          echo "Project: Amlogic-no"
          echo "Device: Generic"
          echo "DTB: sc2_s905x4_sei_smb_280.dtb"

      - name: Build CoreELEC image
        run: |
          make image PROJECT=Amlogic-no DEVICE=Generic ARCH=aarch64

      - name: Prepare release name
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Package firmware
        run: |
          mkdir -p release
          cp target/* release/ || true
          sha256sum release/* > release/SHA256SUMS.txt || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Homatics-4K-Plus-${{ env.BUILD_DATE }}
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: homatics-${{ env.BUILD_DATE }}
          name: CoreELEC Homatics 4K Plus ${{ env.BUILD_DATE }}
          files: release/*
